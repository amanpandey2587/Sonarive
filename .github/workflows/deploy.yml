name: Sonarive — DevOps for AI Pipeline

on:
  push:
    branches: [main]

jobs:
  ml-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Check model accuracy gate
        run: python backend/scripts/check_model_gate.py

  test-backend:
    needs: ml-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests/ -v
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # ✅ moved here

  build:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build backend image
        run: docker build -t sonarive-backend ./backend
      - name: Build frontend image
        run: docker build -t sonarive-frontend -f Dockerfile.frontend .  # ✅ verify path
      - name: Smoke test backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # ✅ added
        run: |
          docker run -d -p 8000:8000 \
            -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            sonarive-backend
          sleep 5
          curl -f http://localhost:8000/health

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "🚀 Point this to your server/cloud"
